; Claude Gadget — Waveshare ESP32-S3-Touch-AMOLED-1.75C
; ESP32-S3R8: 16 MB QIO flash + 8 MB OPI PSRAM, CO5300 466x466 QSPI AMOLED,
; CST9217 touch, AXP2101 PMU.

[env:amoled_175c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DXPOWERS_CHIP_AXP2101
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DFW_VERSION=\"0.1.0\"

; Versions match what Waveshare bundles for this board, except GFX (1.6.4 fails on core 3.3).
lib_deps =
    lvgl/lvgl@8.4.0
    moononournation/GFX Library for Arduino@1.6.8
    lewisxhe/XPowersLib@0.2.6
    lewisxhe/SensorLib@0.3.3
    https://github.com/tzapu/WiFiManager.git#v2.0.17
